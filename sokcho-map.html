 .legend b{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:middle}
 .note{position:absolute;z-index:1000;bottom:18px;right:12px;background:#fff;padding:8px 10px;
   border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.2);font-size:11px;color:#666;max-width:210px}
 .pin{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50% 50% 50% 0;

 .leaflet-popup-content{font-size:13px;line-height:1.5}

title":"저녁: 영금정활어회센타 (활어회)","loc":"영금정활어회센타","lat":38.2116,"lng":128.5972,"idx":7},{"day":"2026-07-29","time":"08:00","title":"호텔 조식","loc":"롯데리조트 속초","lat":38.1798,"lng":128.6047,"idx":1},{"day":"2026-07-29","time":"09:30","title":"외옹치~속초해수욕장 아침 산책","loc":"외옹치 바다향기로","lat":38.1832,"lng":128.6039,"idx":2},{"day":"2026-07-29","time":"11:00","title":"체크아웃","loc":"롯데리조트 속초","lat":38.1798,"lng":128.6047,"idx":3}], paths={"2026-07-26":[[38.1898,128.601],[38.1899,128.6004],[38.1896,128.6012],[38.1793,128.6045]],"2026-07-27":[[38.173,128.541],[38.1699,128.4966],[38.1749,128.4928],[38.2432,128.5665],[38.288,128.545],[38.247,128.5566],[38.2073,128.5912]],"2026-07-28":[[38.1905,128.6015],[38.1798,128.6047],[38.2172,128.5987],[38.2066,128.5905],[38.1961,128.5989],[38.212,128.5975],[38.2116,128.5972]],"2026-07-29":[[38.1798,128.6047],[38.1832,128.6039],[38.1798,128.6047]]}, DAYS={"2026-07-26":{"label":"7/26 (일)","color":"#e6394a"},"2026-07-27":{"label":"7/27 (월)","color":"#2f6fed"},"2026-07-28":{"label":"7/28 (화)","color":"#1f9d55"},"2026-07-29":{"label":"7/29 (수)","color":"#e08e0b"}}, unmapped=[{"day":"2026-07-26","time":"13:00","title":"출발","loc":""},{"day":"2026-07-26","time":"15:00","title":"체크인","loc":""},{"day":"2026-07-29","time":"13:30","title":"귀가 출발","loc":""}];
const map=L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
const all=[];
for(const [day,pts] of Object.entries(paths)){
  L.polyline(pts,{color:DAYS[day].color,weight:3,opacity:.6,dashArray:'6,6'}).addTo(map);
}
for(const m of markers){
  const col=DAYS[m.day].color;
  const icon=L.divIcon({className:'',html:'<div class="pin" style="background:'+col+'"><span>'+m.idx+'</span></div>',iconSize:[26,26],iconAnchor:[13,26],popupAnchor:[0,-24]});
  const mk=L.marker([m.lat,m.lng],{icon}).addTo(map);
  mk.bindPopup('<div class="t">'+DAYS[m.day].label+' · '+m.time+'</div>'+m.title+'<div class="m">'+m.loc+'</div>');
  all.push([m.lat,m.lng]);
}
map.fitBounds(all,{padding:[50,50]});
const leg=document.getElementById('legend');
leg.innerHTML='<div style="font-weight:800;margin-bottom:4px;color:#234f34">날짜별 동선</div>'+
  Object.values(DAYS).map(d=>'<div><b style="background:'+d.color+'"></b>'+d.label+'</div>').join('');
